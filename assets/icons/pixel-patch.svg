<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pixel Patch badge">
  <!-- Bezel -->
  <rect width="80" height="80" rx="10" fill="#000000" stroke="#00aaaa" stroke-width="2"/>
  <rect x="4" y="4" width="72" height="72" rx="8" fill="#000000" stroke="#0000aa" stroke-width="1"/>
  <!-- Corner bolts -->
  <rect x="6" y="6" width="2" height="2" fill="#ffffff"/>
  <rect x="72" y="6" width="2" height="2" fill="#ffffff"/>
  <rect x="6" y="72" width="2" height="2" fill="#ffffff"/>
  <rect x="72" y="72" width="2" height="2" fill="#ffffff"/>

  <!-- Matrix Window -->
  <rect x="16" y="14" width="48" height="44" fill="#000000" stroke="#55ffff" stroke-width="2"/>

  <!-- Corrupted vs Repaired Grid -->
  <g transform="translate(20, 18)">
    <!-- Repaired Left Side (Solid greens & teals) -->
    <rect x="0" y="0" width="8" height="8" fill="#55ff55"/>
    <rect x="10" y="0" width="8" height="8" fill="#55ff55"/>
    <rect x="0" y="10" width="8" height="8" fill="#00aa00"/>
    <rect x="10" y="10" width="8" height="8" fill="#55ff55"/>
    <rect x="0" y="20" width="8" height="8" fill="#55ff55"/>
    <rect x="10" y="20" width="8" height="8" fill="#00aaaa"/>
    <rect x="0" y="28" width="8" height="8" fill="#00aa00"/>
    <rect x="10" y="28" width="8" height="8" fill="#55ff55"/>

    <!-- Glitched Right Side (Magenta, red, yellow noise) -->
    <rect x="22" y="0" width="8" height="8" fill="#ff55ff"/>
    <rect x="32" y="0" width="8" height="8" fill="#555555"/>
    <rect x="22" y="10" width="8" height="8" fill="#ffff55"/>
    <rect x="32" y="10" width="8" height="8" fill="#ff5555"/>
    <rect x="22" y="20" width="8" height="8" fill="#aa00aa"/>
    <rect x="32" y="20" width="8" height="8" fill="#55ffff"/>
    <rect x="22" y="28" width="8" height="8" fill="#555555"/>
    <rect x="32" y="28" width="8" height="8" fill="#ff55ff"/>
  </g>

  <!-- Glowing White Patch Crosshair Cursor -->
  <g transform="translate(38, 24)">
    <rect x="0" y="0" width="12" height="12" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="6" cy="6" r="2" fill="#ffff55"/>
  </g>

  <!-- Game title label -->
  <rect x="16" y="64" width="48" height="10" fill="#00aaaa"/>
  <text x="40" y="72" font-family="monospace" font-weight="bold" font-size="7" fill="#ffffff" text-anchor="middle" letter-spacing="1">PIXEL PATCH</text>
</svg>
