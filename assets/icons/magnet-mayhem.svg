<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Magnet Mayhem badge">
  <defs>
    <pattern id="dither-cyan-mag" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="2" fill="#55ffff"/>
      <rect x="2" y="2" width="2" height="2" fill="#55ffff"/>
    </pattern>
  </defs>
  <!-- Bezel -->
  <rect width="80" height="80" rx="10" fill="#000000" stroke="#ff55ff" stroke-width="2"/>
  <rect x="4" y="4" width="72" height="72" rx="8" fill="#000000" stroke="#aa00aa" stroke-width="1"/>
  <!-- Corner bolts -->
  <rect x="6" y="6" width="2" height="2" fill="#ffffff"/>
  <rect x="72" y="6" width="2" height="2" fill="#ffffff"/>
  <rect x="6" y="72" width="2" height="2" fill="#ffffff"/>
  <rect x="72" y="72" width="2" height="2" fill="#ffffff"/>

  <!-- Magnetic Field Flux Loops -->
  <ellipse cx="40" cy="38" rx="24" ry="16" fill="none" stroke="url(#dither-cyan-mag)" stroke-width="2"/>
  <ellipse cx="40" cy="38" rx="30" ry="22" fill="none" stroke="url(#dither-cyan-mag)" stroke-width="2"/>

  <!-- Horseshoe Magnet Assembly -->
  <!-- Base Curve -->
  <path d="M26,24 C26,12 54,12 54,24" fill="none" stroke="#555555" stroke-width="10"/>

  <!-- North Pole (Red +) -->
  <rect x="21" y="24" width="10" height="16" fill="#ff5555"/>
  <text x="26" y="36" font-family="monospace" font-weight="bold" font-size="10" fill="#ffffff" text-anchor="middle">+</text>

  <!-- South Pole (Blue −) -->
  <rect x="49" y="24" width="10" height="16" fill="#5555ff"/>
  <text x="54" y="36" font-family="monospace" font-weight="bold" font-size="10" fill="#ffffff" text-anchor="middle">−</text>

  <!-- Metallic Bottle Cap Attracted to Magnet -->
  <g transform="translate(34, 42)">
    <circle cx="6" cy="6" r="6" fill="#aaaaaa" stroke="#ffffff" stroke-width="1"/>
    <circle cx="6" cy="6" r="3" fill="#ffff55"/>
  </g>

  <!-- Little ball bearing -->
  <circle cx="48" cy="50" r="2.5" fill="#ffffff"/>

  <!-- Game title label -->
  <rect x="14" y="64" width="52" height="10" fill="#aa00aa"/>
  <text x="40" y="72" font-family="monospace" font-weight="bold" font-size="7" fill="#ff55ff" text-anchor="middle" letter-spacing="1">MAGNET MAYHEM</text>
</svg>
