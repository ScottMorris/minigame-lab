<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Soda Snake badge">
  <!-- Bezel -->
  <rect width="80" height="80" rx="10" fill="#000000" stroke="#ff5555" stroke-width="2"/>
  <rect x="4" y="4" width="72" height="72" rx="8" fill="#000000" stroke="#aa0000" stroke-width="1"/>
  <!-- Corner bolts -->
  <rect x="6" y="6" width="2" height="2" fill="#ffffff"/>
  <rect x="72" y="6" width="2" height="2" fill="#ffffff"/>
  <rect x="6" y="72" width="2" height="2" fill="#ffffff"/>
  <rect x="72" y="72" width="2" height="2" fill="#ffffff"/>

  <!-- Soda Glass / Fluid Ledge Backdrop -->
  <rect x="10" y="52" width="60" height="8" fill="#aa5500"/>
  <rect x="10" y="50" width="60" height="2" fill="#ffff55"/>

  <!-- Coiled Striped Soda Straw Snake -->
  <g transform="translate(14, 20)">
    <!-- Tail Segments -->
    <rect x="0" y="24" width="7" height="6" fill="#ff5555"/>
    <rect x="7" y="24" width="7" height="6" fill="#ffffff"/>
    <rect x="14" y="24" width="7" height="6" fill="#ff5555"/>

    <!-- Upward body curve -->
    <rect x="14" y="18" width="7" height="6" fill="#ffffff"/>
    <rect x="14" y="12" width="7" height="6" fill="#ff5555"/>
    <rect x="21" y="12" width="7" height="6" fill="#ffffff"/>

    <!-- Accordion ribbed bend section -->
    <rect x="28" y="12" width="3" height="6" fill="#aaaaaa"/>
    <rect x="31" y="12" width="3" height="6" fill="#ffffff"/>
    <rect x="34" y="12" width="3" height="6" fill="#aaaaaa"/>

    <!-- Snake Head -->
    <rect x="37" y="10" width="10" height="8" fill="#ff5555"/>
    <rect x="41" y="11" width="3" height="3" fill="#ffffff"/>
    <rect x="42" y="12" width="2" height="2" fill="#000000"/>

    <!-- Forked pink tongue -->
    <path d="M47,14 L53,12 M47,14 L53,16" stroke="#ff55ff" stroke-width="1.5"/>

    <!-- Carbonation Bubble snack -->
    <circle cx="58" cy="14" r="4" fill="#ffff55"/>
    <circle cx="57" cy="13" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Small floating bubbles -->
  <circle cx="20" cy="16" r="2" fill="#ff55ff"/>
  <circle cx="64" cy="22" r="1.5" fill="#55ffff"/>

  <!-- Game title label -->
  <rect x="16" y="64" width="48" height="10" fill="#aa0000"/>
  <text x="40" y="72" font-family="monospace" font-weight="bold" font-size="7" fill="#ffff55" text-anchor="middle" letter-spacing="1">SODA SNAKE</text>
</svg>
