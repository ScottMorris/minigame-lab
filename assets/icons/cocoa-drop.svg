<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cocoa Drop badge">
  <!-- Bezel -->
  <rect width="80" height="80" rx="10" fill="#000000" stroke="#aa5500" stroke-width="2"/>
  <rect x="4" y="4" width="72" height="72" rx="8" fill="#000000" stroke="#555555" stroke-width="1"/>
  <!-- Corner bolts -->
  <rect x="6" y="6" width="2" height="2" fill="#ffffff"/>
  <rect x="72" y="6" width="2" height="2" fill="#ffffff"/>
  <rect x="6" y="72" width="2" height="2" fill="#ffffff"/>
  <rect x="72" y="72" width="2" height="2" fill="#ffffff"/>

  <!-- Matrix Puzzle Column -->
  <rect x="22" y="12" width="36" height="48" fill="#000000" stroke="#5555ff" stroke-width="1.5"/>

  <!-- Falling Block Pair -->
  <rect x="32" y="16" width="12" height="10" fill="#ff5555" stroke="#aa0000" stroke-width="1"/>
  <rect x="32" y="26" width="12" height="10" fill="#55ffff" stroke="#00aaaa" stroke-width="1"/>

  <!-- Stacked Ground Blocks -->
  <rect x="24" y="46" width="10" height="12" fill="#aa5500" stroke="#555555" stroke-width="1"/>
  <rect x="35" y="46" width="10" height="12" fill="#ffff55" stroke="#aa5500" stroke-width="1"/>
  <rect x="46" y="46" width="10" height="12" fill="#ff55ff" stroke="#aa00aa" stroke-width="1"/>

  <rect x="24" y="36" width="10" height="10" fill="#55ffff" stroke="#00aaaa" stroke-width="1"/>

  <!-- Game title label -->
  <rect x="16" y="64" width="48" height="10" fill="#aa5500"/>
  <text x="40" y="72" font-family="monospace" font-weight="bold" font-size="7" fill="#ffff55" text-anchor="middle" letter-spacing="1">COCOA DROP</text>
</svg>
