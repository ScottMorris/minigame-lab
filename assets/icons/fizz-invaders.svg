<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fizz Invaders badge">
  <!-- Bezel -->
  <rect width="80" height="80" rx="10" fill="#000000" stroke="#ff55ff" stroke-width="2"/>
  <rect x="4" y="4" width="72" height="72" rx="8" fill="#000000" stroke="#0000aa" stroke-width="1"/>
  <!-- Corner bolts -->
  <rect x="6" y="6" width="2" height="2" fill="#ffffff"/>
  <rect x="72" y="6" width="2" height="2" fill="#ffffff"/>
  <rect x="6" y="72" width="2" height="2" fill="#ffffff"/>
  <rect x="72" y="72" width="2" height="2" fill="#ffffff"/>

  <!-- Stars -->
  <rect x="16" y="16" width="2" height="2" fill="#ffffff"/>
  <rect x="64" y="20" width="2" height="2" fill="#55ffff"/>
  <rect x="22" y="52" width="2" height="2" fill="#ffff55"/>

  <!-- Giant Pixel Zarg Invader (Crab) -->
  <g transform="translate(24, 18) scale(4)">
    <rect x="2" y="0" width="4" height="1" fill="#ff55ff"/>
    <rect x="1" y="1" width="6" height="1" fill="#aa00aa"/>
    <rect x="0" y="2" width="8" height="2" fill="#ff55ff"/>
    <rect x="2" y="2" width="1" height="1" fill="#000000"/>
    <rect x="5" y="2" width="1" height="1" fill="#000000"/>
    <rect x="1" y="4" width="2" height="2" fill="#aa00aa"/>
    <rect x="5" y="4" width="2" height="2" fill="#aa00aa"/>
  </g>

  <!-- Ascending Cream Soda Bubbles from Blaster -->
  <circle cx="40" cy="50" r="3" fill="#55ffff"/>
  <circle cx="36" cy="56" r="2" fill="#ffffff"/>
  <circle cx="44" cy="58" r="2.5" fill="#ff55ff"/>

  <!-- Game title label -->
  <rect x="14" y="64" width="52" height="10" fill="#0000aa"/>
  <text x="40" y="72" font-family="monospace" font-weight="bold" font-size="7" fill="#ff55ff" text-anchor="middle" letter-spacing="1">FIZZ INVADERS</text>
</svg>
