<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gumdrop Pac-Man badge">
  <!-- Bezel -->
  <rect width="80" height="80" rx="10" fill="#000000" stroke="#ff5555" stroke-width="2"/>
  <rect x="4" y="4" width="72" height="72" rx="8" fill="#000000" stroke="#0000aa" stroke-width="1"/>
  <!-- Corner bolts -->
  <rect x="6" y="6" width="2" height="2" fill="#ffffff"/>
  <rect x="72" y="6" width="2" height="2" fill="#ffffff"/>
  <rect x="6" y="72" width="2" height="2" fill="#ffffff"/>
  <rect x="72" y="72" width="2" height="2" fill="#ffffff"/>

  <!-- Citadel Maze Wall Segments -->
  <path d="M12,20 L30,20 L30,36" fill="none" stroke="#0000aa" stroke-width="3"/>
  <path d="M50,14 L68,14 L68,36" fill="none" stroke="#0000aa" stroke-width="3"/>
  <path d="M12,52 L68,52" fill="none" stroke="#0000aa" stroke-width="3"/>

  <!-- Gumdrop Snack Pellets -->
  <circle cx="20" cy="42" r="3" fill="#ffff55"/>
  <circle cx="32" cy="42" r="3" fill="#ff55ff"/>
  <circle cx="44" cy="42" r="3" fill="#ffff55"/>

  <!-- Retro Red Maze Phantom Ghost (Blinky) -->
  <g transform="translate(46, 24)">
    <path d="M2,24 L2,10 C2,2 22,2 22,10 L22,24 L18,20 L14,24 L10,20 L6,24 L2,20 Z" fill="#ff5555"/>
    <!-- Big expressive white eyes looking left towards snacks -->
    <circle cx="8" cy="9" r="3" fill="#ffffff"/>
    <circle cx="7" cy="9" r="1.5" fill="#0000aa"/>
    <circle cx="16" cy="9" r="3" fill="#ffffff"/>
    <circle cx="15" cy="9" r="1.5" fill="#0000aa"/>
  </g>

  <!-- Game title label -->
  <rect x="14" y="64" width="52" height="10" fill="#aa0000"/>
  <text x="40" y="72" font-family="monospace" font-weight="bold" font-size="7" fill="#ffff55" text-anchor="middle" letter-spacing="1">GUMDROP PAC</text>
</svg>
