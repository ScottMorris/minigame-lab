<!-- Hero banner for the Mini Game Lab README, drawn in the 16-colour EGA palette the Fizz games use. -->
<!-- -->
<!-- (c) Copyright 2026 Liminal HQ, Scott Morris -->
<!-- SPDX-License-Identifier: Apache-2.0 OR MIT -->
<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Mini Game Lab — Lieutenant Fizz 2</title>
  <desc id="hero-desc">Mini Game Lab: six retro arcade experiments built on the Lieutenant Fizz 2 engine. A 16-colour EGA scene features Ben Blaze bouncing on his pogo stick, a Zarg saucer with a dithered tractor beam, rising cream soda fizz bubbles, descending pixel invaders, falling cocoa crystals, and a gloop slug popping from a crater.</desc>

  <style>
    @media (prefers-reduced-motion: reduce) {
      .motion { display: none; }
    }
    text { paint-order: stroke; }
  </style>

  <defs>
    <!-- EGA palette: black 000000, blue 0000aa, green 00aa00, cyan 00aaaa, red aa0000, magenta aa00aa, brown aa5500, grey aaaaaa,
         dark grey 555555, light blue 5555ff, light green 55ff55, light cyan 55ffff, light red ff5555, light magenta ff55ff,
         yellow ffff55, white ffffff. -->

    <!-- 50% dither patterns -->
    <pattern id="dither-yellow" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="2" fill="#ffff55"/>
      <rect x="2" y="2" width="2" height="2" fill="#ffff55"/>
    </pattern>
    <pattern id="dither-cyan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="2" fill="#55ffff"/>
      <rect x="2" y="2" width="2" height="2" fill="#55ffff"/>
    </pattern>
    <pattern id="dither-blue" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="2" fill="#0000aa"/>
      <rect x="2" y="2" width="2" height="2" fill="#0000aa"/>
    </pattern>
    <pattern id="dither-magenta" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="2" fill="#aa00aa"/>
      <rect x="2" y="2" width="2" height="2" fill="#aa00aa"/>
    </pattern>

    <clipPath id="frame">
      <rect width="1200" height="320" rx="18"/>
    </clipPath>
  </defs>

  <rect width="1200" height="320" rx="18" fill="#000000"/>

  <g clip-path="url(#frame)" shape-rendering="crispEdges">
    <!-- Starfield and cosmic horizon -->
    <rect x="520" y="176" width="680" height="16" fill="url(#dither-blue)"/>
    <rect x="520" y="192" width="680" height="24" fill="url(#dither-blue)"/>
    <rect x="520" y="216" width="680" height="24" fill="#0000aa"/>
    <rect x="516" y="0" width="4" height="320" fill="#221e33"/>

    <!-- Static and twinkling stars -->
    <g>
      <rect x="560" y="40" width="4" height="4" fill="#ffffff"/>
      <rect x="640" y="96" width="4" height="4" fill="#aaaaaa"/>
      <rect x="760" y="28" width="4" height="4" fill="#ffffff"/>
      <rect x="830" y="70" width="4" height="4" fill="#55ffff"/>
      <rect x="910" y="36" width="4" height="4" fill="#ffffff"/>
      <rect x="1060" y="104" width="4" height="4" fill="#aaaaaa"/>
      <rect x="1150" y="150" width="4" height="4" fill="#ffffff"/>
      <rect x="680" y="130" width="4" height="4" fill="#555555"/>
      <rect x="1100" y="44" width="4" height="4" fill="#ffffff"/>
    </g>
    <g class="motion" fill="#ffff55">
      <rect x="710" y="52" width="6" height="6">
        <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="884" y="22" width="6" height="6">
        <animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="1130" y="80" width="6" height="6">
        <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.8s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Ground & Cocoa Fields -->
    <rect x="520" y="252" width="680" height="68" fill="#555555"/>
    <rect x="520" y="252" width="680" height="8" fill="#aa5500"/>
    <rect x="520" y="260" width="680" height="4" fill="#00aa00"/>

    <!-- Game Element 1: Fizz Invaders (Descending Zargs) -->
    <g class="motion">
      <animateTransform attributeName="transform" type="translate" values="0,0; 16,0; 0,0" dur="2s" calcMode="discrete" repeatCount="indefinite"/>
      <!-- Invader 1 (Magenta) -->
      <g transform="translate(560, 48) scale(2)">
        <rect x="2" y="0" width="4" height="1" fill="#ff55ff"/>
        <rect x="1" y="1" width="6" height="1" fill="#aa00aa"/>
        <rect x="0" y="2" width="8" height="2" fill="#ff55ff"/>
        <rect x="2" y="2" width="1" height="1" fill="#000000"/>
        <rect x="5" y="2" width="1" height="1" fill="#000000"/>
        <rect x="1" y="4" width="2" height="2" fill="#aa00aa"/>
        <rect x="5" y="4" width="2" height="2" fill="#aa00aa"/>
      </g>
      <!-- Invader 2 (Cyan) -->
      <g transform="translate(610, 48) scale(2)">
        <rect x="2" y="0" width="4" height="1" fill="#55ffff"/>
        <rect x="1" y="1" width="6" height="1" fill="#00aaaa"/>
        <rect x="0" y="2" width="8" height="2" fill="#55ffff"/>
        <rect x="2" y="2" width="1" height="1" fill="#000000"/>
        <rect x="5" y="2" width="1" height="1" fill="#000000"/>
        <rect x="1" y="4" width="2" height="2" fill="#00aaaa"/>
        <rect x="5" y="4" width="2" height="2" fill="#00aaaa"/>
      </g>
    </g>

    <!-- Rising Fizz Bubbles from Ben's Blaster -->
    <g class="motion" fill="#ff55ff">
      <circle cx="810" cy="180" r="5">
        <animateMotion dur="2.2s" repeatCount="indefinite" path="M0,0 L-60,-130"/>
        <animate attributeName="opacity" values="0.9;0" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="810" cy="180" r="4" fill="#ffffff">
        <animateMotion dur="2.2s" begin="0.7s" repeatCount="indefinite" path="M0,0 L-40,-130"/>
        <animate attributeName="opacity" values="0.9;0" dur="2.2s" begin="0.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="810" cy="180" r="6" fill="#ff55ff">
        <animateMotion dur="2.2s" begin="1.4s" repeatCount="indefinite" path="M0,0 L-80,-130"/>
        <animate attributeName="opacity" values="0.8;0" dur="2.2s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Game Element 2: Cocoa Drop (Falling crystals & chocolate blocks) -->
    <g transform="translate(680, 110)">
      <rect x="0" y="0" width="48" height="140" fill="#181424" stroke="#332b4a" stroke-width="2"/>
      <!-- Stacked blocks -->
      <rect x="4" y="112" width="18" height="24" fill="#aa5500" stroke="#555555" stroke-width="2"/>
      <rect x="26" y="112" width="18" height="24" fill="#55ffff" stroke="#00aaaa" stroke-width="2"/>
      <rect x="4" y="84" width="18" height="24" fill="#ffff55" stroke="#aa5500" stroke-width="2"/>
      <!-- Falling block -->
      <g class="motion">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,56; 0,0" dur="2.4s" repeatCount="indefinite"/>
        <rect x="26" y="24" width="18" height="24" fill="#ff55ff" stroke="#aa00aa" stroke-width="2"/>
      </g>
    </g>

    <!-- Game Element 3: Gloop Slugger (Crater & popping slug) -->
    <g transform="translate(970, 246)">
      <!-- Crater hole -->
      <ellipse cx="28" cy="18" rx="28" ry="10" fill="#110d18" stroke="#aa5500" stroke-width="3"/>
      <!-- Gloop Slug popping up -->
      <g class="motion">
        <animateTransform attributeName="transform" type="translate" values="0,18; 0,-16; 0,-16; 0,18" keyTimes="0; 0.25; 0.75; 1" dur="2.8s" repeatCount="indefinite"/>
        <path d="M12,18 C12,0 44,0 44,18 Z" fill="#55ff55" stroke="#00aa00" stroke-width="2"/>
        <circle cx="20" cy="8" r="3" fill="#ffffff"/>
        <circle cx="21" cy="8" r="1.5" fill="#000000"/>
        <circle cx="36" cy="8" r="3" fill="#ffffff"/>
        <circle cx="37" cy="8" r="1.5" fill="#000000"/>
      </g>
    </g>

    <!-- Game Element 4: Zarg Saucer with Tractor Beam -->
    <g transform="translate(1020, 20)">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-8;0,0" dur="3s" repeatCount="indefinite"/>
      <!-- Tractor beam -->
      <path d="M40,76 L100,76 L130,220 L10,220 Z" fill="url(#dither-cyan)"/>
      <!-- Lifted cocoa bean -->
      <g class="motion" fill="#aa5500" stroke="#000000" stroke-width="2">
        <rect x="62" y="200" width="16" height="12" rx="3">
          <animateMotion dur="2.4s" repeatCount="indefinite" path="M0,0 L0,-110"/>
          <animate attributeName="opacity" values="1;1;0" dur="2.4s" repeatCount="indefinite"/>
        </rect>
      </g>
      <!-- Saucer dome & hull -->
      <path d="M50,56 L60,34 L80,34 L90,56 Z" fill="#55ffff" stroke="#000000" stroke-width="3"/>
      <path d="M20,60 L40,50 L100,50 L120,60 L110,76 L30,76 Z" fill="#aa00aa" stroke="#000000" stroke-width="3"/>
      <path d="M40,50 L100,50 L120,60 L20,60 Z" fill="#ff55ff"/>
      <!-- Running lights -->
      <g fill="#ffff55">
        <rect x="36" y="66" width="6" height="6"/>
        <rect x="56" y="68" width="6" height="6"/>
        <rect x="76" y="68" width="6" height="6"/>
        <rect x="96" y="66" width="6" height="6"/>
      </g>
    </g>

    <!-- Game Element 5: Ben on Pogo Stick (Pogo Panic) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-44;0,0" dur="1.4s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.2 0.6 0.4 1;0.6 0 0.8 0.4" repeatCount="indefinite"/>
      <g transform="translate(816, 172) scale(3)">
        <g>
          <!-- Helmet -->
          <rect x="4" y="0" width="3" height="1" fill="#000000"/>
          <rect x="7" y="0" width="2" height="1" fill="#55ff55"/>
          <rect x="9" y="0" width="3" height="1" fill="#000000"/>
          <rect x="3" y="1" width="1" height="1" fill="#000000"/>
          <rect x="4" y="1" width="8" height="1" fill="#55ff55"/>
          <rect x="12" y="1" width="1" height="1" fill="#000000"/>
          <rect x="2" y="2" width="1" height="1" fill="#000000"/>
          <rect x="3" y="2" width="3" height="1" fill="#55ff55"/>
          <rect x="6" y="2" width="4" height="1" fill="#ffffff"/>
          <rect x="10" y="2" width="3" height="1" fill="#55ff55"/>
          <rect x="13" y="2" width="1" height="1" fill="#000000"/>
          <!-- Face -->
          <rect x="3" y="4" width="10" height="3" fill="#ffffff"/>
          <rect x="9" y="5" width="2" height="2" fill="#000000"/>
          <!-- Red Shirt -->
          <rect x="4" y="9" width="8" height="5" fill="#aa0000"/>
          <!-- Blue Pants -->
          <rect x="5" y="14" width="6" height="4" fill="#0000aa"/>
          <!-- Pogo Shaft & Footpegs -->
          <rect x="7" y="18" width="2" height="12" fill="#aaaaaa"/>
          <rect x="4" y="21" width="8" height="2" fill="#555555"/>
          <!-- Spring & Tip -->
          <rect x="6" y="30" width="4" height="2" fill="#555555"/>
          <animate attributeName="visibility" calcMode="discrete" keyTimes="0;0.0857;1" values="hidden;visible;visible" dur="1.4s" repeatCount="indefinite"/>
        </g>
        <g visibility="hidden">
          <!-- Squash frame -->
          <rect x="4" y="2" width="8" height="1" fill="#55ff55"/>
          <rect x="3" y="5" width="10" height="3" fill="#ffffff"/>
          <rect x="9" y="6" width="2" height="2" fill="#000000"/>
          <rect x="4" y="10" width="8" height="5" fill="#aa0000"/>
          <rect x="5" y="15" width="6" height="4" fill="#0000aa"/>
          <rect x="7" y="19" width="2" height="10" fill="#aaaaaa"/>
          <rect x="4" y="22" width="8" height="2" fill="#555555"/>
          <rect x="6" y="29" width="4" height="2" fill="#555555"/>
          <animate attributeName="visibility" calcMode="discrete" keyTimes="0;0.0857;1" values="visible;hidden;hidden" dur="1.4s" repeatCount="indefinite"/>
        </g>
      </g>
    </g>

    <!-- Title block: classic EGA arcade typography -->
    <g font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-weight="bold">
      <!-- Main Title -->
      <text x="59" y="112" font-size="52" fill="#0000aa" letter-spacing="2">MINI GAME LAB</text>
      <text x="56" y="109" font-size="52" fill="#ffffff" letter-spacing="2">MINI GAME LAB</text>

      <!-- Subtitle -->
      <text x="59" y="162" font-size="24" fill="#aa0000" letter-spacing="6">LIEUTENANT FIZZ 2</text>
      <text x="56" y="159" font-size="24" fill="#ffff55" letter-spacing="6">LIEUTENANT FIZZ 2</text>

      <!-- Tagline -->
      <text x="58" y="200" font-size="15" fill="#ff55ff" letter-spacing="2">RETRO ARCADE EXPERIMENTS</text>

      <!-- Chips/Badges -->
      <g font-size="12" letter-spacing="2">
        <rect x="56" y="230" width="58" height="24" fill="#0000aa" stroke="#55ffff" stroke-width="2"/>
        <text x="69" y="247" fill="#55ffff">WEB</text>

        <rect x="122" y="230" width="68" height="24" fill="#aa5500" stroke="#ffff55" stroke-width="2"/>
        <text x="134" y="247" fill="#ffff55">RUST</text>

        <rect x="198" y="230" width="68" height="24" fill="#2a1f44" stroke="#ff55ff" stroke-width="2"/>
        <text x="212" y="247" fill="#ff55ff">WASM</text>

        <rect x="274" y="230" width="112" height="24" fill="#005500" stroke="#55ff55" stroke-width="2"/>
        <text x="286" y="247" fill="#55ff55">UNDERTONE</text>
      </g>

      <text x="58" y="286" font-size="11" fill="#aaaaaa" letter-spacing="1">DETERMINISTIC SIMULATION · SIX ARCADE GAMES</text>
    </g>
  </g>
</svg>
