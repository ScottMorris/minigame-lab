<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crystal Defender — Lieutenant Fizz 2</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #050409;
        background-image:
          radial-gradient(circle at 50% 30%, rgba(255, 85, 255, 0.12), transparent 60%),
          linear-gradient(to bottom, #090714 0%, #030206 100%);
        color: #f5efe9;
        font-family: ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow-x: hidden;
        user-select: none;
      }
      .cabinet {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: #14101e;
        border: 4px solid #aa00aa;
        border-radius: 12px;
        box-shadow:
          0 0 0 3px #555555,
          0 12px 36px rgba(0, 0, 0, 0.8),
          0 0 24px rgba(255, 85, 255, 0.25);
        padding: 16px 20px 20px 20px;
        max-width: 95vw;
      }
      .marquee {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #1a1226;
        border: 2px solid #ff55ff;
        border-radius: 6px;
        padding: 6px 16px;
        margin-bottom: 12px;
        box-shadow: inset 0 0 12px rgba(255, 85, 255, 0.3);
      }
      .marquee h1 {
        margin: 0;
        font-size: 1.25rem;
        letter-spacing: 2px;
        color: #ff55ff;
        text-shadow:
          2px 2px 0 #aa0000,
          0 0 8px #ff55ff;
      }
      .marquee .sub {
        font-size: 0.75rem;
        color: #55ffff;
        letter-spacing: 1px;
      }
      .crt-frame {
        position: relative;
        background: #000;
        padding: 8px;
        border: 3px solid #555555;
        border-radius: 8px;
        box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.9);
      }
      canvas {
        display: block;
        background: #000000;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        border: 2px solid #332b4a;
      }
      .cabinet-footer {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
        font-size: 0.75rem;
        color: #aaaaaa;
      }
      .controls-pill {
        background: #1a1226;
        padding: 4px 10px;
        border: 1px solid #555555;
        border-radius: 4px;
        color: #ff55ff;
      }
      .coin-slot {
        color: #55ff55;
        font-weight: bold;
        letter-spacing: 1px;
        animation: blink 1.2s infinite;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }
      .back-link {
        position: absolute;
        top: 1rem;
        left: 1rem;
        color: #ffaa40;
        text-decoration: none;
        font-size: 0.85rem;
        font-weight: bold;
        padding: 0.4rem 0.8rem;
        background: rgba(20, 16, 30, 0.85);
        border: 1px solid #ffaa40;
        border-radius: 6px;
        z-index: 10;
        transition: background 0.15s ease;
      }
      .back-link:hover {
        background: #ffaa40;
        color: #0b0a12;
      }
    </style>
  </head>
  <body>
    <a href="../../" class="back-link">← Hub</a>

    <div class="cabinet">
      <div class="marquee">
        <div>
          <h1>CRYSTAL DEFENDER</h1>
          <span class="sub">AMETHYST CAVERN ODYSSEY</span>
        </div>
        <div class="controls-pill">EGA 16-COLOUR</div>
      </div>

      <div class="crt-frame">
        <canvas id="game" width="800" height="600"></canvas>
      </div>

      <div class="cabinet-footer">
        <div class="controls-pill">
          ← →: ROTATE | ↑: THRUST | ↓: REVERSE | SPACE: FIRE | P: PAUSE
        </div>
        <div class="coin-slot">CREDIT: FREE PLAY</div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
