<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Mini Game Lab Favicon">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff55ff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#aa00aa" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0b0a12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181424"/>
      <stop offset="100%" stop-color="#0b0a12"/>
    </linearGradient>
  </defs>

  <!-- Squircle container -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#ffaa40" stroke-opacity="0.3" stroke-width="4"/>
  <circle cx="256" cy="256" r="180" fill="url(#glow)"/>

  <!-- Pixel art: Arcade joystick & Fizz emblem in authentic EGA palette -->
  <g transform="translate(64, 64) scale(0.75)" shape-rendering="crispEdges">
    <!-- Outer soda / arcade circle badge -->
    <circle cx="256" cy="256" r="160" fill="#aa00aa" shape-rendering="geometricPrecision"/>
    <circle cx="256" cy="256" r="148" fill="#000000" shape-rendering="geometricPrecision"/>

    <!-- Fizz bubbles -->
    <rect x="180" y="140" width="16" height="16" fill="#ff55ff"/>
    <rect x="184" y="144" width="8" height="8" fill="#ffffff"/>

    <rect x="320" y="160" width="12" height="12" fill="#55ffff"/>
    <rect x="322" y="162" width="6" height="6" fill="#ffffff"/>

    <rect x="140" y="240" width="14" height="14" fill="#ff55ff"/>
    <rect x="350" y="270" width="18" height="18" fill="#ffff55"/>
    <rect x="354" y="274" width="8" height="8" fill="#ffffff"/>

    <rect x="170" y="330" width="12" height="12" fill="#55ffff"/>
    <rect x="310" y="340" width="16" height="16" fill="#ff55ff"/>

    <!-- Pixel Art: Ben's Helmet / Arcade Joystick Base -->
    <!-- Helmet Top (Green) -->
    <rect x="208" y="176" width="96" height="20" fill="#55ff55"/>
    <rect x="188" y="196" width="136" height="24" fill="#55ff55"/>
    <rect x="176" y="220" width="160" height="24" fill="#55ff55"/>

    <!-- Visor / Face (White & Yellow) -->
    <rect x="176" y="244" width="160" height="20" fill="#00aa00"/>
    <rect x="196" y="264" width="120" height="28" fill="#ffffff"/>
    <rect x="216" y="272" width="24" height="16" fill="#0000aa"/>
    <rect x="272" y="272" width="24" height="16" fill="#0000aa"/>

    <!-- Red Chin Strap / Joystick Base -->
    <rect x="188" y="292" width="136" height="16" fill="#aa0000"/>
    <rect x="208" y="308" width="96" height="16" fill="#ff5555"/>

    <!-- Arcade Joystick Handle & Ball Top -->
    <!-- Ball Top (Yellow / Orange EGA) -->
    <circle cx="256" cy="148" r="28" fill="#ffaa40" shape-rendering="geometricPrecision"/>
    <circle cx="256" cy="148" r="22" fill="#ffff55" shape-rendering="geometricPrecision"/>
    <circle cx="248" cy="140" r="8" fill="#ffffff" shape-rendering="geometricPrecision"/>

    <!-- Joystick Shaft -->
    <rect x="250" y="170" width="12" height="30" fill="#aaaaaa"/>
    <rect x="252" y="170" width="4" height="30" fill="#ffffff"/>
  </g>
</svg>
