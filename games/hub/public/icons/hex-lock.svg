<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hex Lock badge">
  <!-- Bezel -->
  <rect width="80" height="80" rx="10" fill="#000000" stroke="#ffff55" stroke-width="2"/>
  <rect x="4" y="4" width="72" height="72" rx="8" fill="#000000" stroke="#aa5500" stroke-width="1"/>
  <!-- Corner bolts -->
  <rect x="6" y="6" width="2" height="2" fill="#ffffff"/>
  <rect x="72" y="6" width="2" height="2" fill="#ffffff"/>
  <rect x="6" y="72" width="2" height="2" fill="#ffffff"/>
  <rect x="72" y="72" width="2" height="2" fill="#ffffff"/>

  <!-- Circuit Trace Grid -->
  <line x1="40" y1="12" x2="40" y2="20" stroke="#55ffff" stroke-width="2"/>
  <line x1="16" y1="36" x2="24" y2="36" stroke="#55ffff" stroke-width="2"/>
  <line x1="64" y1="36" x2="56" y2="36" stroke="#55ffff" stroke-width="2"/>
  <line x1="24" y1="52" x2="30" y2="48" stroke="#ffff55" stroke-width="2"/>
  <line x1="56" y1="52" x2="50" y2="48" stroke="#ffff55" stroke-width="2"/>

  <!-- Outer Hexagonal Cyber Ring -->
  <polygon points="40,16 60,26 60,46 40,56 20,46 20,26" fill="#0000aa" stroke="#55ffff" stroke-width="2"/>

  <!-- Inner Hexagonal Core -->
  <polygon points="40,24 50,30 50,42 40,48 30,42 30,30" fill="#000000" stroke="#ffff55" stroke-width="2"/>

  <!-- Center Power Shard -->
  <circle cx="40" cy="36" r="4" fill="#ffffff"/>
  <circle cx="40" cy="36" r="2" fill="#ffff55"/>

  <!-- Contact Nodes -->
  <circle cx="40" cy="16" r="2" fill="#ffffff"/>
  <circle cx="60" cy="26" r="2" fill="#ffffff"/>
  <circle cx="60" cy="46" r="2" fill="#ffffff"/>
  <circle cx="40" cy="56" r="2" fill="#ffffff"/>
  <circle cx="20" cy="46" r="2" fill="#ffffff"/>
  <circle cx="20" cy="26" r="2" fill="#ffffff"/>

  <!-- Game title label -->
  <rect x="18" y="64" width="44" height="10" fill="#aa5500"/>
  <text x="40" y="72" font-family="monospace" font-weight="bold" font-size="7" fill="#ffff55" text-anchor="middle" letter-spacing="1">HEX LOCK</text>
</svg>
