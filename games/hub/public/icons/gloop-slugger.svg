<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gloop Slugger badge">
  <!-- Bezel -->
  <rect width="80" height="80" rx="10" fill="#000000" stroke="#55ff55" stroke-width="2"/>
  <rect x="4" y="4" width="72" height="72" rx="8" fill="#000000" stroke="#aa5500" stroke-width="1"/>
  <!-- Corner bolts -->
  <rect x="6" y="6" width="2" height="2" fill="#ffffff"/>
  <rect x="72" y="6" width="2" height="2" fill="#ffffff"/>
  <rect x="6" y="72" width="2" height="2" fill="#ffffff"/>
  <rect x="72" y="72" width="2" height="2" fill="#ffffff"/>

  <!-- Crater Hole in Cocoa Crust -->
  <ellipse cx="40" cy="50" rx="26" ry="10" fill="#000000" stroke="#aa5500" stroke-width="3"/>

  <!-- Popping Gloop Slug -->
  <path d="M26,50 C26,24 54,24 54,50 Z" fill="#55ff55" stroke="#00aa00" stroke-width="2"/>
  <!-- Slug Eyes -->
  <circle cx="34" cy="34" r="4" fill="#ffffff"/>
  <circle cx="35" cy="34" r="2" fill="#000000"/>
  <circle cx="46" cy="34" r="4" fill="#ffffff"/>
  <circle cx="47" cy="34" r="2" fill="#000000"/>
  <!-- Antenna with yellow tip -->
  <line x1="40" y1="28" x2="40" y2="20" stroke="#00aa00" stroke-width="2"/>
  <circle cx="40" cy="18" r="2" fill="#ffff55"/>

  <!-- Whack Reflex Mallet Starburst -->
  <g transform="translate(52, 14)">
    <polygon points="6,0 8,4 12,5 9,8 10,12 6,10 2,12 3,8 0,5 4,4" fill="#ffff55"/>
  </g>

  <!-- Game title label -->
  <rect x="14" y="64" width="52" height="10" fill="#aa5500"/>
  <text x="40" y="72" font-family="monospace" font-weight="bold" font-size="7" fill="#55ff55" text-anchor="middle" letter-spacing="1">GLOOP SLUGGER</text>
</svg>
