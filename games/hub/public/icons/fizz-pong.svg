<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fizz-Pong badge">
  <defs>
    <pattern id="dither-cyan-pong" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="2" fill="#55ffff"/>
      <rect x="2" y="2" width="2" height="2" fill="#55ffff"/>
    </pattern>
  </defs>
  <!-- Bezel -->
  <rect width="80" height="80" rx="10" fill="#000000" stroke="#55ffff" stroke-width="2"/>
  <rect x="4" y="4" width="72" height="72" rx="8" fill="#000000" stroke="#0000aa" stroke-width="1"/>
  <!-- Corner bolts -->
  <rect x="6" y="6" width="2" height="2" fill="#ffffff"/>
  <rect x="72" y="6" width="2" height="2" fill="#ffffff"/>
  <rect x="6" y="72" width="2" height="2" fill="#ffffff"/>
  <rect x="72" y="72" width="2" height="2" fill="#ffffff"/>

  <!-- Arena Court Net -->
  <line x1="40" y1="12" x2="40" y2="60" stroke="#555555" stroke-dasharray="3,3" stroke-width="2"/>

  <!-- Left Paddle (Cyan) -->
  <rect x="12" y="22" width="6" height="22" fill="#55ffff" stroke="#00aaaa" stroke-width="1"/>

  <!-- Right Paddle (Red) -->
  <rect x="62" y="28" width="6" height="22" fill="#ff5555" stroke="#aa0000" stroke-width="1"/>

  <!-- Bouncing Plasma Ball & Carbonation Trail -->
  <!-- Trail particles -->
  <rect x="22" y="32" width="3" height="3" fill="#00aaaa"/>
  <rect x="28" y="30" width="4" height="4" fill="#55ffff"/>
  <rect x="34" y="28" width="4" height="4" fill="#ffff55"/>
  <!-- Ball -->
  <circle cx="44" cy="27" r="5" fill="#ffff55"/>
  <circle cx="44" cy="27" r="2" fill="#ffffff"/>

  <!-- Fizz bubbles -->
  <circle cx="20" cy="16" r="2" fill="#ff55ff"/>
  <circle cx="60" cy="18" r="2" fill="#55ffff"/>

  <!-- Game title label -->
  <rect x="16" y="64" width="48" height="10" fill="#0000aa"/>
  <text x="40" y="72" font-family="monospace" font-weight="bold" font-size="8" fill="#55ffff" text-anchor="middle" letter-spacing="1">FIZZ-PONG</text>
</svg>
