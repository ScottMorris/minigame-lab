<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fizz Invaders</title>
    <style>
      body {
        margin: 0;
        background: #0b0a12;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      canvas {
        background: #000;
        border: 4px solid #8b6851;
        image-rendering: pixelated;
        width: 800px;
        height: 600px;
      }
      .back-link {
        position: absolute;
        top: 1rem;
        left: 1rem;
        color: #ffaa40;
        text-decoration: none;
        font-family: monospace;
        font-size: 1rem;
        font-weight: bold;
        padding: 0.4rem 0.8rem;
        background: rgba(18, 14, 26, 0.85);
        border: 1px solid #ffaa40;
        border-radius: 6px;
        z-index: 10;
        transition: background 0.15s ease;
      }
      .back-link:hover {
        background: #ffaa40;
        color: #0b0a12;
      }
    </style>
  </head>
  <body>
    <a href="../../" class="back-link">← Hub</a>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
